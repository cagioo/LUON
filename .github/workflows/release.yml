name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: luon-linux-x64
          - os: macos-latest
            artifact: luon-macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: gcc -O2 -Wall -Wextra -o luon runtime/luon_vm.c

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: luon

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: luon-linux-x64
          path: dist/linux

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: luon-macos-x64
          path: dist/macos

      - name: Package
        run: |
          cd dist/linux && tar czf ../../luon-linux-x64.tar.gz luon && cd ../..
          cd dist/macos && tar czf ../../luon-macos-x64.tar.gz luon && cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            luon-linux-x64.tar.gz
            luon-macos-x64.tar.gz
            bootstrap/compiler.wasm
          body: |
            ## Luon ${{ github.ref_name }}

            ### Downloads
            - **Linux x64**: `luon-linux-x64.tar.gz`
            - **macOS x64**: `luon-macos-x64.tar.gz`
            - **Bootstrap Compiler**: `compiler.wasm`

            ### Quick Start
            ```bash
            tar xzf luon-linux-x64.tar.gz
            chmod +x luon
            ./luon build examples/fibonacci.luon
            ```
