name: Luon CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-runtime:
    name: Build Native Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build luon_vm
        run: gcc -O2 -Wall -Wextra -o luon runtime/luon_vm.c -lm

      - name: Verify binary
        run: ./luon version || echo "Version check completed"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: luon-linux-x64
          path: luon

  test-examples:
    name: Test Example Programs
    runs-on: ubuntu-latest
    needs: build-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime
        run: gcc -O2 -o luon runtime/luon_vm.c -lm

      - name: Compile examples
        run: |
          PASS=0
          FAIL=0
          for f in examples/*.luon; do
            echo "=== Compiling: $f ==="
            if ./luon build "$f" 2>/dev/null; then
              echo "  ✅ PASS"
              PASS=$((PASS + 1))
            else
              echo "  ❌ FAIL"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          if [ $FAIL -gt 0 ]; then
            exit 1
          fi

  test-stdlib:
    name: Test Standard Library
    runs-on: ubuntu-latest
    needs: build-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime
        run: gcc -O2 -o luon runtime/luon_vm.c -lm

      - name: Compile stdlib modules
        run: |
          for f in stdlib/*.luon; do
            echo "=== Checking: $f ==="
            ./luon build "$f" 2>/dev/null || echo "  ⚠ Warning: $f"
          done

  test-bootstrap:
    name: Test Self-Hosting Compiler
    runs-on: ubuntu-latest
    needs: build-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime
        run: gcc -O2 -o luon runtime/luon_vm.c -lm

      - name: Verify bootstrap compiler WASM exists
        run: |
          test -f bootstrap/compiler.wasm && echo "✅ compiler.wasm present" || echo "❌ compiler.wasm missing"
          test -f bootstrap/compiler.luon && echo "✅ compiler.luon present" || echo "❌ compiler.luon missing"
          ls -la bootstrap/

      - name: Verify compiler WASM size
        run: |
          SIZE=$(stat -c%s bootstrap/compiler.wasm)
          echo "compiler.wasm size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ compiler.wasm seems too small"
            exit 1
          fi
          echo "✅ Size check passed"

  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          REQUIRED="README.md LICENSE CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md"
          for f in $REQUIRED; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ Missing: $f"
              exit 1
            fi
          done

      - name: Check stdlib modules
        run: |
          echo "Standard Library Modules:"
          ls -la stdlib/*.luon
          COUNT=$(ls stdlib/*.luon | wc -l)
          echo "Total: $COUNT modules"
          if [ "$COUNT" -lt 4 ]; then
            echo "❌ Too few stdlib modules"
            exit 1
          fi
          echo "✅ Stdlib check passed"

      - name: Check examples
        run: |
          echo "Example Programs:"
          ls -la examples/*.luon
          COUNT=$(ls examples/*.luon | wc -l)
          echo "Total: $COUNT examples"

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build luon_vm
        run: gcc -O2 -Wall -Wextra -o luon runtime/luon_vm.c -lm

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: luon-macos-x64
          path: luon
